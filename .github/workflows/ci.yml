name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: scripts/check.sh (Node ${{ matrix.node }}, ubuntu)
    runs-on: ubuntu-24.04 # check.sh targets Playwright's ubuntu24.04-x64 build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26] # README: Node.js 24 or newer (24 = minimum, 26 = current LTS)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (pnpm version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install gitleaks v8.30.1 (checksum verified)
        run: |
          v=8.30.1
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          mkdir -p .tools && tar -xzf gl.tgz -C .tools gitleaks && rm gl.tgz
      - name: Use the public demo settings
        run: cp .env.example .env
      - run: scripts/check.sh
