<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wireframe · form-welcome (/f/[token])</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#222;background:#f0f0f0;font-size:15px}
.card{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;padding:24px 20px;display:flex;flex-direction:column}
.logo{width:120px;height:40px;border:1px solid #888;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:6px}
.illus{height:160px;border:1px solid #999;background:#e4e4e4;border-radius:16px;margin:24px 0;display:flex;align-items:center;justify-content:center;color:#666}
.btn{display:block;width:100%;border:1px solid #333;border-radius:12px;padding:16px;min-height:52px;background:#444;color:#fff;text-align:center;font-size:17px}
.muted{color:#666;font-size:13px}
.chip{display:inline-block;border:1px solid #888;border-radius:16px;padding:4px 10px;font-size:12px;background:#eee}
@media(min-width:900px){.card{min-height:auto;margin:40px auto;border:1px solid #888;border-radius:16px}}
</style></head><body>
<div class="card">
  <div class="logo">[Chandra Honda]</div>
  <div class="illus">[scooter illustration]</div>
  <h1 style="font-size:24px;margin:0 0 8px">Hi Ramesh, how was your Activa 6G's service on 14 Nov?</h1>
  <p><span class="chip">TN 09 BX 4521</span> <span class="chip">Advisor: Suresh</span></p>
  <p class="muted">Takes about 2 minutes · 6 short steps</p>
  <div style="flex:1"></div>
  <div class="btn" style="margin-top:24px">Start</div>
</div>
</body></html>
