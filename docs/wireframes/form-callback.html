<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wireframe · form-callback</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#222;background:#f0f0f0;font-size:15px}
.card{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;padding:16px 20px 110px}
.head{display:flex;justify-content:space-between;font-size:12px;color:#555}
.bar{height:8px;background:#ddd;border-radius:4px;margin:8px 0 4px}.bar i{display:block;height:8px;width:100%;background:#555;border-radius:4px}
.illus{height:120px;border:1px solid #999;background:#e4e4e4;border-radius:16px;margin:20px 0;display:flex;align-items:center;justify-content:center;color:#666}
.chips{display:flex;gap:10px}
.chip{flex:1;border:1px solid #888;border-radius:24px;padding:16px;min-height:56px;background:#f4f4f4;text-align:center;font-size:17px}
.chip.sel{border:2px solid #222;background:#ccc;font-weight:bold}
.muted{color:#666;font-size:12px}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #888;padding:12px 16px}
.sticky .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:1px solid #333;border-radius:12px;padding:14px;min-height:52px;background:#e6e6e6;text-align:center;font-size:16px}
.btn.primary{flex:2;background:#444;color:#fff}
@media(min-width:900px){.card{min-height:auto;margin:32px auto 120px;border:1px solid #888;border-radius:16px}}
</style></head><body>
<div class="card">
  <div class="head"><span>Ramesh · Activa 6G · TN 09 BX 4521</span><span>Step 6 of 6</span></div>
  <div class="bar"><i></i></div>
  <div class="illus">[phone / call illustration]</div>
  <h2 style="font-size:20px">Would you like someone from our service team to call you?</h2>
  <div class="chips"><div class="chip sel">Yes</div><div class="chip">No</div></div>
  <p class="muted" style="margin-top:16px">Required. Submit stays disabled until Yes or No is chosen.</p>
</div>
<div class="sticky"><div class="in"><div class="btn">Back</div><div class="btn primary">Submit</div></div></div>
</body></html>
